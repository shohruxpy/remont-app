          title: New Parts Amount
        refurbished_parts_qty:
          type: number
          title: Refurbished Parts Qty
        top_parts:
          items:
            type: object
          type: array
          title: Top Parts
        refurbishment_share_pct:
          type: number
          title: Refurbishment Share Pct
        zaprafka_expenses:
          anyOf:
          - type: number
          - type: 'null'
          title: Zaprafka Expenses
      type: object
      required:
      - repairs_count
      - new_parts_qty
      - new_parts_amount
      - refurbished_parts_qty
      - top_parts
      - refurbishment_share_pct
      - zaprafka_expenses
      title: AnalyticsHistoryOut
    Body_import_machines_api_v1_machines_import_post:
